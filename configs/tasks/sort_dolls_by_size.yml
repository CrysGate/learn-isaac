instruction: "Arrange the five nesting dolls in a straight line along the center of the table, ordered from smallest to largest in the positive Y direction."
spawn_clearance_m: 0.003
minimum_object_gap_m: 0.02
sampling_attempts_per_object: 1000

physics:
  restitution: 0.01
  linear_damping: 0.10
  angular_damping: 0.10
  sleep_threshold: 0.005
  stabilization_threshold: 0.001

# Initial poses are generated from a seed inside the scene's
# task_object_placement_area, or loaded from an exported layout JSON file.
dolls:
  - asset_id: "00000"
    usd_path: Assets/Object/Rigid/matryoshka_dolls/00000/object.usdz
    metadata_path: Assets/Object/Rigid/matryoshka_dolls/00000/metadata.json
  - asset_id: "00001"
    usd_path: Assets/Object/Rigid/matryoshka_dolls/00001/object.usdz
    metadata_path: Assets/Object/Rigid/matryoshka_dolls/00001/metadata.json
  - asset_id: "00002"
    usd_path: Assets/Object/Rigid/matryoshka_dolls/00002/object.usdz
    metadata_path: Assets/Object/Rigid/matryoshka_dolls/00002/metadata.json
  - asset_id: "00003"
    usd_path: Assets/Object/Rigid/matryoshka_dolls/00003/object.usdz
    metadata_path: Assets/Object/Rigid/matryoshka_dolls/00003/metadata.json
  - asset_id: "00004"
